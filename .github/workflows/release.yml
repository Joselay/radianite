name: Release

# Publishes the current main as the next version, a GitHub release that installed apps offer as an update.
# Run it from the Actions tab, or with: gh workflow run release.yml [-f bump=minor|major]
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Which number goes up: patch (1.2.3 to 1.2.4), minor (1.3.0) or major (2.0.0)"
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write

concurrency: release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The build number counts commits, and the version and notes follow from the last release's tag.
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          # The default also asks for "tools", which the SDK no longer has, and fails the job.
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Signing key
        # Every release must be signed with the same key, or installed apps can't update to it.
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > release.keystore
          {
            echo "storeFile=release.keystore"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties
      - name: Version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          previous=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)
          if [ -z "$previous" ]; then
            next=1.0.0
          else
            if [ "$(git rev-list --count "$previous..HEAD")" = 0 ]; then
              echo "::error::Nothing new since $previous; commit something first."
              exit 1
            fi
            IFS=. read -r major minor patch <<< "${previous#v}"
            case "$BUMP" in
              major) next=$((major + 1)).0.0 ;;
              minor) next=$major.$((minor + 1)).0 ;;
              *) next=$major.$minor.$((patch + 1)) ;;
            esac
          fi
          echo "previous=$previous" >> "$GITHUB_OUTPUT"
          echo "next=$next" >> "$GITHUB_OUTPUT"
      - name: Unit tests and a signed release build
        run: ./gradlew testDebugUnitTest assembleRelease -PreleaseVersion=${{ steps.version.outputs.next }}
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS: ${{ steps.version.outputs.previous }}
          VERSION: ${{ steps.version.outputs.next }}
        run: |
          range=${PREVIOUS:+$PREVIOUS..}HEAD
          notes=$(git log --no-merges --format='- %s' "$range" | head -n 30)
          apk="radianite-$VERSION.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          gh release create "v$VERSION" "$apk" --target "$GITHUB_SHA" --title "Radianite $VERSION" --notes "$notes"
