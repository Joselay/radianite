name: Release

# Publishes the current main as a GitHub release that installed apps offer as an update.
# Run it from the Actions tab, or with: gh workflow run release.yml
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency: release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The version code counts commits, and the notes list them since the last release.
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          # The default also asks for "tools", which the SDK no longer has, and fails the job.
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Signing key
        # Every release must be signed with the same key, or installed apps can't update to it.
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > release.keystore
          {
            echo "storeFile=release.keystore"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties
      - name: Unit tests and a signed release build
        run: ./gradlew testDebugUnitTest assembleRelease
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code=$(git rev-list --count HEAD)
          tag="v$code"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "::error::$tag is already released; commit something new first."
            exit 1
          fi
          previous=$(git tag --list 'v*' --sort=-v:refname | head -n 1)
          range=${previous:+$previous..}HEAD
          notes=$(git log --no-merges --format='- %s' "$range" | head -n 30)
          apk="radianite-$tag.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          gh release create "$tag" "$apk" --target "$GITHUB_SHA" --title "Radianite $tag" --notes "$notes"
